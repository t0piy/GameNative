# Fork CI validation enabled; keep PR and manual validation paths aligned.
name: Pull Request build check

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [Modern]
    runs-on: ubuntu-latest
    name: build (${{ matrix.variant }})

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject build credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          api_key="${POSTHOG_API_KEY:-dummy}"
          host="${POSTHOG_HOST:-https://us.i.posthog.com}"
          cat <<EOF > local.properties
          POSTHOG_API_KEY=$api_key
          POSTHOG_HOST=$host
          EOF
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (${{ matrix.variant }})
        timeout-minutes: 30
        run: |
          : > gradle.log
          tail -n +1 -F gradle.log &
          tail_pid=$!
          ./gradlew :app:test${{ matrix.variant }}DebugUnitTest > gradle.log 2>&1 &
          gradle_pid=$!
          last_size=0
          stalled_for=0
          while kill -0 "$gradle_pid" 2>/dev/null; do
            sleep 15
            size=$(stat -c %s gradle.log)
            if [ "$size" -eq "$last_size" ]; then
              stalled_for=$((stalled_for + 15))
            else
              stalled_for=0
              last_size=$size
            fi
            if [ "$stalled_for" -ge 600 ]; then
              echo "::error::No Gradle output for 10 minutes, dumping test JVM threads"
              for pid in $(pgrep -f 'Gradle Test Executor'); do
                echo "===== jstack $pid ====="
                jstack "$pid" || true
              done
              pkill -f 'Gradle Test Executor' || true
              kill "$gradle_pid" || true
              sleep 2
              kill "$tail_pid" || true
              exit 1
            fi
          done
          wait "$gradle_pid"
          status=$?
          sleep 2
          kill "$tail_pid" || true
          exit $status

      - name: Upload test reports (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.variant }}
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/test${{ matrix.variant }}DebugUnitTest/**
            app/build/test-results/test${{ matrix.variant }}DebugUnitTest/**
